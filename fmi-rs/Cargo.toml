[package]
name = "fmi-rs"
version = "0.1.0"
edition = "2024"
description = "Functional Mock-up Interface (FMI) for Rust"
license = "BSD-2-Clause"
repository = "https://github.com/CATIA-Systems/fmi-rs"
readme = "README.md"

[features]
default = ["zip"]
schema = []
sundials = []
test-fixtures = ["dep:reqwest", "dep:anyhow"]
zip = ["dep:zip"]

[dependencies]
anyhow = {version = "1.0.103", optional = true }
approx = "0.5.1"
askama = "0.16.0"
colored = "3.1.1"
csv = "1.4.0"
itertools = "0.15.0"
libc = "0.2.189"
libloading = "0.9.0"
quick-xml = { version = "0.36", features = ["serialize"] }
reqwest = { version = "0.13.4", features = ["blocking"], optional = true }
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.21"
strum = "0.28.0"
strum_macros = "0.28.0"
tempfile = "3.27"
thiserror = "2.0.18"
url = "2"
zip = { version = "8.6", optional = true }

[build-dependencies]
cc = "1.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
fmi-rs = { path = ".", features = ["test-fixtures", "sundials"] }
rstest = "0.26.1"

[lints.clippy]
# Disallow explicit panicking mechanisms
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"

# Disallow implicit panicking operations
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

# Additional safety lints for fallible operations
out_of_bounds_indexing = "deny"
string_slice = "deny" # Slicing strings can panic if cut on non-UTF-8 boundaries
