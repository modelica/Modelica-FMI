on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
        - runner: windows-2022
          artifact: win64
          paths: |
            ./target/release/modelica-fmi.exe
            ./target/release/ModelicaFMI.dll
        - runner: ubuntu-22.04
          artifact: linux64
          paths: |
            ./target/release/modelica-fmi
            ./target/release/libModelicaFMI.so
        - runner: macos-14
          artifact: darwin64
          paths: |
            ./target/release/modelica-fmi
            ./target/release/libModelicaFMI.dylib
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - run: cargo clippy --workspace --all-targets -- -D warnings
    - run: cargo build --workspace --release
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.paths }}
        if-no-files-found: error
  build-modelica-library:
    runs-on: ubuntu-22.04
    needs: build-binaries
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions/download-artifact@v8
      with:
        name: win64
        path: ./FMI/Resources/Library/win64/
    - uses: actions/download-artifact@v8
      with:
        name: linux64
        path: ./FMI/Resources/Library/linux64/
    - uses: actions/download-artifact@v8
      with:
        name: darwin64
        path: ./FMI/Resources/Library/darwin64/
    - run: tree
    - uses: actions/upload-artifact@v7
      with:
        name: Modelica-FMI
        path: |
          FMI
          LICENSE
          README.md
        if-no-files-found: error
